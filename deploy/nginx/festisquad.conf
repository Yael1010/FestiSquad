# Sustituir dominio y rutas de certificados antes de desplegar.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name api.festisquad.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.festisquad.example;

    ssl_certificate /etc/letsencrypt/live/api.festisquad.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.festisquad.example/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384;

    client_max_body_size 1m;

    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }
}
